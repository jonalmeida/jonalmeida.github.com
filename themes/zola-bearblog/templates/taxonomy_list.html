{% extends "base.html" %}

{%- block main -%}
  <main>
    <h1>{{ taxonomy.name | capitalize }}</h1>
    <div class="tags">
      {%- set tags = get_taxonomy(kind=taxonomy?.name or "tags", lang=lang) %}
      {%- for post in tags?.items or [] %}
        <a href="{{ post.permalink }}">#{{ post.name }}</a>&nbsp;
      {%- endfor %}
    </div>
  </main>
{%- endblock main -%}
