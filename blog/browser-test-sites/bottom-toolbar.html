<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bottom toolbar test cases: GeckoView and Fenix</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #15141a;
  --muted: #5b5b66;
  --card: #f0f0f4;
  --line: #cfcfd8;
  --accent: #0061e0;
  --pass: #017a40;
  --fail: #c50042;
  --skip: #6f6f7d;
  --stripe: rgba(0, 97, 224, 0.07);
  --panel: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1b22;
    --fg: #fbfbfe;
    --muted: #bfbfc9;
    --card: #2b2a33;
    --line: #52525e;
    --accent: #00ddff;
    --pass: #54ffbd;
    --fail: #ff848b;
    --skip: #bfbfc9;
    --stripe: rgba(0, 221, 255, 0.08);
    --panel: #1c1b22;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--fg);
}
code {
  font: 0.9em ui-monospace, "Roboto Mono", monospace;
  background: var(--card);
  padding: 0 3px;
  border-radius: 3px;
  overflow-wrap: anywhere;
}
a { color: var(--accent); }
button, .btn, select, input[type="search"], input[type="text"] {
  font: inherit;
  font-size: 14px;
  min-height: 34px;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--card);
  color: var(--fg);
}
button, .btn { cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
button.pass, .status.pass { color: var(--pass); border-color: var(--pass); }
button.fail, .status.fail { color: var(--fail); border-color: var(--fail); }
button.skip, .status.skip { color: var(--skip); border-color: var(--skip); }
button[aria-pressed="true"] { outline: 2px solid currentColor; font-weight: 700; }

/* Index */
.index { max-width: 900px; margin: 0 auto; padding: 12px 14px 160px; }
.index h1 { font-size: 1.5em; margin: 8px 90px 4px 0; }
.index h2 { font-size: 1.2em; margin: 28px 0 4px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.index .lead { color: var(--muted); margin-top: 0; }
.index details.howto { background: var(--card); border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
.index details.howto summary { font-weight: 600; cursor: pointer; }
.filters { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.filters input[type="search"] { flex: 1 1 160px; }
.progress { font-size: 13px; color: var(--muted); margin: 6px 0; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
.card-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.card-head .cid { font: 600 13px ui-monospace, monospace; color: var(--muted); }
.card-head a.title { font-weight: 600; flex: 1 1 60%; }
.badge, .status { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); white-space: nowrap; }
.badge.gv { border-color: #9059ff; color: #9059ff; }
.badge.fenix { border-color: #e66000; color: #e66000; }
.badge.manual { border-style: dashed; }
.card details summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-top: 4px; }
.card h4, #bt-details h4 { margin: 10px 0 2px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.card ul, .card ol, #bt-details ul, #bt-details ol { margin: 2px 0; padding-left: 22px; }
.src { font-size: 12px; }
.src li { overflow-wrap: anywhere; }

/* Panel and HUD */
#bt-panel {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0;
  right: 0;
  z-index: 2147483000;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  max-height: 75svh;
  overflow: auto;
  overscroll-behavior: contain;
  font-size: 14px;
  -moz-text-size-adjust: none;
  text-size-adjust: none;
}
#bt-panel .bar { display: flex; gap: 6px; align-items: center; padding: 6px 8px; }
#bt-panel .bar .cid { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bt-details { padding: 0 10px 10px; }
#bt-details h2 { font-size: 16px; margin: 4px 0; }
#bt-details .result { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
#bt-details .result input { flex: 1 1 100%; }
#bt-hud { font: 11.5px/1.35 ui-monospace, "Roboto Mono", monospace; padding: 4px 10px 8px; margin: 0; white-space: pre-wrap; border-top: 1px dashed var(--line); }
#bt-chip {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 6px);
  right: 6px;
  z-index: 2147483000;
  opacity: 0.93;
  -moz-text-size-adjust: none;
  text-size-adjust: none;
}
#bt-probes > div { position: fixed; top: 0; left: 0; width: 1px; visibility: hidden; pointer-events: none; }
#bt-export { position: fixed; inset: 10% 5%; z-index: 2147483001; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
#bt-export textarea { flex: 1; font: 12px ui-monospace, monospace; }

/* Fixture building blocks */
.rows > div { height: 100px; padding: 8px 12px; border-bottom: 1px solid var(--line); font: 13px ui-monospace, monospace; color: var(--muted); }
.rows > div:nth-child(even) { background: var(--stripe); }
.fbar { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; z-index: 10; display: flex; gap: 2px; background: #a33b00; }
.fbar > * { flex: 1; border: 0; border-radius: 0; background: #ff7139; color: #15141a; font-weight: 600; min-height: 0; }
.fbar.top { top: 0; bottom: auto; }
.edge { position: fixed; left: 0; right: 0; bottom: 0; height: 3px; background: #ff0039; z-index: 9; pointer-events: none; }
.note { margin: 12px; padding: 10px 12px; border-left: 4px solid var(--accent); background: var(--card); border-radius: 4px; }
.ctl { margin: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.spacer-top { height: 60px; }
.hero { display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; color: #fff; font-weight: 600; }
.hero > div { padding: 10px; background: rgba(0, 0, 0, 0.35); }
.big-input { display: block; width: calc(100% - 24px); margin: 12px; min-height: 44px; font-size: 16px; }
.scroller { margin: 12px; height: 300px; overflow: auto; border: 2px solid var(--accent); }
.hscroller { margin: 12px; overflow-x: auto; white-space: nowrap; border: 2px solid var(--accent); }
.hscroller > div { display: inline-block; width: 70vw; height: 160px; margin: 6px; background: var(--stripe); border: 1px solid var(--line); }
.float { position: fixed; right: 8px; top: 38%; z-index: 20; display: flex; flex-direction: column; gap: 6px; max-width: 46vw; }
.float > button { box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
.ubar { position: fixed; top: 0; width: 16px; z-index: 5; pointer-events: none; writing-mode: vertical-rl; font: 10px/16px ui-monospace, monospace; color: #fff; text-align: end; padding-bottom: 4px; opacity: 0.85; }
.variants { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.variants a[aria-current] { font-weight: 700; outline: 2px solid var(--accent); }
#bt-hudwrap .hudbar { padding: 0 10px; }
.pad { margin: 12px; height: 260px; border: 2px dashed var(--fail); display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; }
</style>
<script>
"use strict";

const DEFAULT_VIEWPORT = "width=device-width, initial-scale=1";
const SRC_ALIASES = {
  "GV/": "mobile/android/geckoview/src/androidTest/java/org/mozilla/geckoview/test/",
  "ACW/": "mobile/android/android-components/components/ui/widgets/src/test/java/mozilla/components/ui/widgets/",
  "AC/": "mobile/android/android-components/components/",
  "FUT/": "mobile/android/fenix/app/src/test/java/org/mozilla/fenix/",
  "FUI/": "mobile/android/fenix/app/src/androidTest/java/org/mozilla/fenix/ui/",
  "APZ/": "gfx/layers/apz/test/mochitest/",
  "RT/": "layout/reftests/async-scrolling/",
};

/* Fixture helpers. Each returns an HTML string. */
function rows(n = 60, label = "Row") {
  let s = '<div class="rows">';
  for (let i = 1; i <= n; i++) {
    s += `<div>${label} ${i}</div>`;
  }
  return s + "</div>";
}
function fixedBar(label = "Fixed bar (bottom: 0)", cls = "") {
  return `<div class="fbar ${cls}" data-measure="${label}">` +
    `<button onclick="BT.tap(event, 'A')">A</button>` +
    `<button onclick="BT.tap(event, 'B')">B</button>` +
    `<button onclick="BT.tap(event, 'C')">C</button></div>`;
}
function note(html) {
  return `<div class="note">${html}</div>`;
}
function controls(buttons) {
  return `<div class="ctl">${buttons.map(([label, js]) => `<button onclick="${js}">${label}</button>`).join("")}</div>`;
}

function float(buttons) {
  return `<div class="float">${buttons.map(([label, js]) => `<button onclick="${js}">${label}</button>`).join("")}</div>`;
}
function unitBars() {
  const bars = [["100svh", "#0061e0"], ["100dvh", "#017a40"], ["100lvh", "#c50042"], ["100vh", "#7542e5"], ["100%", "#a33b00"]];
  return bars.map(([h, color], i) =>
    `<div class="ubar" style="right:${4 + i * 18}px;height:${h};background:${color}">${h}</div>`).join("");
}

function kbFixture() {
  return `<div class="spacer-top"></div><input class="big-input" id="kb-top" placeholder="Text field at the top">` +
    rows(15) + `<input class="big-input" id="kb-mid" placeholder="Text field in the middle">` + rows(15) +
    `<input class="big-input" id="kb-end" placeholder="Text field at the end of the page"><div style="height:70px"></div>` +
    '<div class="edge"></div>' + fixedBar();
}
function pads(list) {
  return list.map(([id, label]) => `<div class="pad" id="${id}">${label}</div>`).join("");
}
function frame(height, inner) {
  return `<iframe style="height:${height}" srcdoc="<!DOCTYPE html><html style='height:100%'><body style='margin:0;height:100%'>` +
    `<div style='box-sizing:border-box;height:${inner};padding:70px 12px;background:linear-gradient(#0061e0,#00b3f4);color:#fff;font:16px sans-serif'>` +
    `iframe content, height ${inner}</div></body></html>"></iframe>`;
}
function form(v, fields, submit) {
  return `<form method="get" class="ctl" style="flex-direction:column;align-items:stretch;padding-bottom:80px">` +
    `<input type="hidden" name="case" value="UI-05"><input type="hidden" name="v" value="${v}">` +
    fields.map(([name, ac, ph, type]) =>
      `<input class="big-input" style="margin:0;width:100%" name="${name}" autocomplete="${ac}" placeholder="${ph}" type="${type || "text"}">`).join("") +
    `<button>${submit}</button></form>`;
}
function articleText() {
  const p = [
    "A browser on a phone has little space. The address bar, the navigation buttons and the page share one small screen. When the address bar is at the bottom of the screen, it is near your thumb, and you can reach it with one hand.",
    "The toolbar hides when you scroll down. Then the page gets more space. When you scroll up, the toolbar comes back. The engine must tell the page about each change, so that fixed elements and viewport units stay correct.",
    "Web pages put many elements at the bottom edge. Chat apps put a text field there. Shops put a buy button there. Cookie banners and consent dialogs also sit at the bottom. All of them must stay visible and must not jump.",
    "The software keyboard also opens at the bottom edge. When the keyboard opens, the page can resize, or the keyboard can cover the page. The interactive-widget key in the meta viewport tells the engine which behavior the page wants.",
    "Pull to refresh is another gesture at the top of the page. It must start only when the page is at its top, and only when the page does not use the touch for its own purpose, for example a map or a drawing app.",
    "Fullscreen video removes all browser bars. When you exit fullscreen, the bars must come back fully, and the page must get its old size again. The same is true after you rotate the device, or after you switch tabs.",
    "Each of these behaviors has automated tests in GeckoView, in Gecko, in Android Components or in Fenix. This article exists so that the reader view and the Listen to page feature have content to show.",
    "Read this text in reader view. Scroll down and up. The toolbar must hide and show as on a normal page, and the reader view controls must not be under the toolbar.",
  ];
  return `<article style="margin:70px 14px 80px;max-width:40em"><h1>How the bottom toolbar shares the screen</h1>` +
    `<p class="byline">By the Firefox for Android team</p>${p.map(t => `<p>${t}</p>`).join("")}</article>`;
}
function frenchText() {
  const p = [
    "La barre d'outils du navigateur se trouve en bas de l'écran. Quand vous faites défiler la page vers le bas, la barre d'outils disparaît. Quand vous faites défiler la page vers le haut, elle revient.",
    "Les sites web placent souvent des éléments fixes en bas de la page, par exemple un bouton d'achat, une bannière de cookies ou un champ de texte pour discuter. Ces éléments doivent rester visibles au-dessus de la barre d'outils.",
    "Le clavier virtuel s'ouvre aussi en bas de l'écran. La page peut changer de taille, ou le clavier peut couvrir une partie de la page. La clé interactive-widget de la balise meta viewport choisit ce comportement.",
    "Cette page sert à tester la bannière de traduction. La bannière doit rester au-dessus de la barre d'outils et doit se déplacer avec elle quand vous faites défiler la page.",
  ];
  return `<div style="margin:70px 14px 0">${p.concat(p).map(t => `<p>${t}</p>`).join("")}</div>`;
}

const P = {
  dyn: "GV/DynamicToolbarTest.kt",
  iw: "GV/InteractiveWidgetTest.kt",
  ird: "GV/InputResultDetailTest.kt",
  pzc: "GV/PanZoomControllerTest.kt",
  gestures: "ACW/behavior/EngineViewScrollingGesturesBehaviorTest.kt",
  scrollData: "ACW/behavior/EngineViewScrollingDataBehaviorTest.kt",
  clipping: "ACW/behavior/EngineViewClippingBehaviorTest.kt",
  strategy: "ACW/behavior/ViewYTranslationStrategyTest.kt",
  detector: "ACW/behavior/BrowserGestureDetectorTest.kt",
  swipeLayout: "ACW/VerticalSwipeRefreshLayoutTest.kt",
  tbController: "AC/feature/toolbar/src/test/java/mozilla/components/feature/toolbar/ToolbarBehaviorControllerTest.kt",
  swipeRefresh: "AC/feature/session/src/test/java/mozilla/components/feature/session/SwipeRefreshFeatureTest.kt",
  fullScreen: "AC/feature/session/src/test/java/mozilla/components/feature/session/FullScreenFeatureTest.kt",
  nested: "AC/browser/engine-gecko/src/test/java/mozilla/components/browser/engine/gecko/NestedGeckoViewTest.kt",
  vScroll: "AC/browser/engine-gecko/src/test/java/mozilla/components/browser/engine/gecko/GeckoVerticalScrollListenerTest.kt",
  engineView: "AC/browser/engine-gecko/src/test/java/mozilla/components/browser/engine/gecko/GeckoEngineViewTest.kt",
  mediaFs: "AC/feature/media/src/test/java/mozilla/components/feature/media/fullscreen/MediaSessionFullscreenFeatureTest.kt",
  saveLogin: "AC/feature/prompts/src/test/java/mozilla/components/feature/prompts/dialog/SaveLoginDialogFragmentTest.kt",
  prompts: "AC/feature/prompts/src/test/java/mozilla/components/feature/prompts/PromptFeatureTest.kt",
  perms: "AC/feature/sitepermissions/src/test/java/mozilla/components/feature/sitepermissions/SitePermissionsDialogFragmentTest.kt",
  bbft: "FUT/browser/BaseBrowserFragmentTest.kt",
  bft: "FUT/browser/BrowserFragmentTest.kt",
  tit: "FUT/components/toolbar/ToolbarsIntegrationTest.kt",
  heights: "FUT/ext/BaseBrowserFragmentTest.kt",
  settings: "FUT/utils/SettingsTest.kt",
};

const SECTIONS = [
  { id: "vp", title: "Viewport sizes and events", intro: "These cases measure what the page sees when the toolbar is fully shown, partly hidden and fully hidden. Read the values in the HUD." },
  { id: "fx", title: "Fixed and sticky content", intro: "Elements that are fixed or stuck to the bottom edge must move with the toolbar. They must not leave a gap, overlap the toolbar, or move away from your tap." },
  { id: "sc", title: "When the toolbar hides and shows", intro: "The toolbar moves only when the engine reports that the root page used a vertical scroll. These cases find the limits of that rule." },
  { id: "th", title: "Touch handling", intro: "Touch listeners and `touch-action` can take a gesture away from the browser. Then the toolbar must not move." },
  { id: "pr", title: "Pull to refresh and overscroll", intro: "Pull to refresh starts only when the page is at its top, the page does not use the touch, and overscroll on the vertical axis is allowed." },
  { id: "kb", title: "Keyboard and interactive-widget", intro: "The software keyboard opens at the same edge as the toolbar. The `interactive-widget` key of the meta viewport tells the engine how to resize." },
  { id: "zm", title: "Zoom and wide pages", intro: "Pinch zoom, double-tap zoom and pages that are wider than the screen change the scale. The toolbar rules must stay correct at all scales." },
  { id: "fs", title: "Fullscreen, safe area and rotation", intro: "Fullscreen removes the toolbar. Safe-area insets and rotation change the edges of the page." },
  { id: "ui", title: "Fenix UI at the bottom edge", intro: "Fenix puts bars, sheets and prompts at the bottom edge. They must not be under the toolbar or the keyboard, and they must not cover the content that they are for." },
  { id: "st", title: "Fenix settings and toolbar states", intro: "Settings, accessibility services, layouts and app states that change the toolbar height, or stop the toolbar from moving." },
];

const CASES = [
  /* Viewport sizes and events */
  {
    id: "VP-01", section: "vp", platforms: ["GV", "Fenix"],
    title: "Viewport units in each toolbar state",
    html: () => unitBars() + note("The bars on the right edge use the heights <code>100svh</code>, <code>100dvh</code>, <code>100lvh</code>, <code>100vh</code> and fixed <code>100%</code>. The HUD shows the same values in CSS px.") + rows(40),
    init() {
      BT.metric("media query height = client height", () => matchMedia(`(height: ${document.documentElement.clientHeight}px)`).matches);
    },
    steps: [
      "Load the page. Do not scroll. Read `svh`, `dvh`, `lvh`, `vh` and `fixed100%` in the HUD.",
      "Scroll down slowly. Stop when the toolbar is approximately half hidden. Keep your finger on the screen and read the values.",
      "Scroll down until the toolbar is fully hidden. Read the values.",
    ],
    expected: [
      "Toolbar fully shown: `svh` = `dvh` = `fixed100%` = `client` height. `lvh` = `vh` = `svh` + the toolbar height. The media query line is `true`.",
      "Toolbar partly hidden: `svh`, `lvh`, `vh` and `fixed100%` do not change. `dvh` is between `svh` and `lvh`.",
      "Toolbar fully hidden: `dvh` = `lvh` and `fixed100%` = `lvh`. The green and brown bars touch the bottom edge of the screen.",
    ],
    sources: [
      `${P.dyn} :: viewportVariants, percentBaseValueOnPositionFixedElement`,
      "layout/base/tests/test_dynamic_toolbar_max_height.html",
      "testing/web-platform/tests/css/css-values/viewport-units-compute.html",
      `${P.engineView} :: setDynamicToolbarMaxHeight is forwarded to GeckoView instance`,
    ],
  },
  {
    id: "VP-02", section: "vp", platforms: ["GV", "Fenix"],
    title: "Resize events, innerHeight and visualViewport while the toolbar moves",
    html: () => note("Tap <b>Reset counters</b> in the HUD before each step. The event log shows the <code>inner</code> and <code>vv</code> sizes at each event.") + rows(60),
    steps: [
      "Tap `Reset counters`.",
      "Scroll down very slowly. Keep your finger on the screen until the toolbar is fully hidden.",
      "Read the counters and the event log.",
      "Tap `Reset counters`. Scroll up very slowly until the toolbar is fully shown.",
    ],
    expected: [
      "While the toolbar moves, `vv.resize` fires many times. The `vv` height changes with each pixel of toolbar movement.",
      "While the toolbar moves, no window `resize` event fires, and the `inner` height does not change.",
      "When the toolbar becomes fully hidden, one window `resize` event fires. The `inner` height increases by the toolbar height.",
      "When the toolbar starts to show again, one window `resize` event fires. The `inner` height goes back to its first value.",
    ],
    sources: [
      `${P.dyn} :: visualViewportEvents, resizeEvents, windowInnerHeight`,
      "testing/web-platform/tests/visual-viewport/viewport-url-bar-changes-height-manual.html",
      "dom/base/test/test_domwindowutils.html :: test_setDynamicToolbarMaxHeight",
    ],
  },
  {
    id: "VP-03", section: "vp", platforms: ["GV"],
    title: "Fast direction changes at the end of the toolbar movement",
    html: () => rows(60),
    steps: [
      "Scroll down until the toolbar is almost fully hidden. Do not lift your finger.",
      "Move your finger quickly up and down by a small distance, five times.",
      "Lift your finger. Wait 1 second.",
    ],
    expected: [
      "The browser does not crash or freeze.",
      "The toolbar stops fully shown or fully hidden. The HUD values agree with that state, as in VP-01 and VP-02.",
    ],
    sources: [`${P.dyn} :: notCrashOnResizeEvent`],
  },
  {
    id: "VP-04", section: "vp", platforms: ["GV"],
    title: "IntersectionObserver near the toolbar edge",
    css: "body { margin: 0; } #io-wrap { position: relative; height: 2000px; } #io-target { position: absolute; left: 0; width: 100%; height: 10px; top: calc(100lvh + 1px); background: red; }",
    html: () => `<div id="io-wrap">${note("The red line starts 1 px below the bottom edge of the screen (<code>100lvh + 1px</code>). It turns green when the IntersectionObserver reports that it is visible.")}<div id="io-target"></div></div>`,
    variants: [
      { label: "Scale 1", note: "Default viewport." },
      {
        label: "Desktop scale 0.5", viewport: "width=device-width, minimum-scale=0.5",
        css: "body { width: 200%; } #io-target { top: calc(200lvh + 1px); }",
        note: "The page is zoomed out to 0.5.",
      },
    ],
    init() {
      const t = document.getElementById("io-target");
      new IntersectionObserver(entries => {
        for (const e of entries) {
          t.style.background = e.isIntersecting ? "green" : "red";
          BT.log(`IO ${e.isIntersecting ? "visible" : "not visible"}`);
        }
      }).observe(t);
      BT.metric("red line top", () => num(t.getBoundingClientRect().top));
    },
    steps: [
      "Scroll down very slowly. Keep your finger on the screen. Look at the line as it comes up from the bottom edge.",
      "Stop when the toolbar is fully hidden.",
      "Scroll down 10 px more.",
    ],
    expected: [
      "While the toolbar is partly hidden, the line can show in the strip that the toolbar uncovers, but it stays red. The root of the observer is the layout viewport.",
      "When the toolbar is fully hidden and the line is on the screen, the line is green.",
    ],
    sources: [`${P.dyn} :: withIntersectionObserver1, withIntersectionObserver2, withIntersectionObserverWithDesktopMode1, withIntersectionObserverWithDesktopMode2`],
  },

  /* Fixed and sticky content */
  {
    id: "FX-01", section: "fx", platforms: ["GV", "Fenix"],
    title: "Fixed bar at bottom: 0 follows the toolbar, and taps hit the correct button",
    html: () => note("The orange bar is <code>position: fixed; bottom: 0</code>. A red line at <code>bottom: 0</code> is under it. If the bar moves away from the bottom edge, the red line shows.") + rows(60) + '<div class="edge"></div>' + fixedBar(),
    steps: [
      "Scroll down slowly. Look at the orange bar while the toolbar moves.",

  {
    id: "FS-03", section: "fs", platforms: ["Fenix"],
    title: "Fullscreen video",
    html: () => note("Tap <b>Make test video</b>. The page records a 3 s video with a quiet tone. Then tap <b>Play</b>.") +
      '<video id="vid" controls playsinline loop style="display:block;width:100%;max-height:60vh;background:#000"></video>' +
      controls([["Make test video", "makeVideo()"], ["Play", "document.getElementById('vid').play()"], ["Video fullscreen", "document.getElementById('vid').requestFullscreen()"]]) + rows(30),
    variants: [
      { label: "Landscape video", size: [640, 360], note: "The screen rotates to landscape in fullscreen." },
      { label: "Portrait video", size: [360, 640], note: "The screen stays in portrait in fullscreen." },
    ],
    init(fx, v) {
      window.makeVideo = () => {
        const [w, h] = v.size;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        let frame = 0;
        let drawing = true;
        const draw = () => {
          frame++;
          ctx.fillStyle = `hsl(${(frame * 3) % 360}, 70%, 40%)`;
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = "#fff";
          ctx.font = `${Math.round(h / 10)}px sans-serif`;
          ctx.fillText(`${w}x${h} frame ${frame}`, 20, h / 2);
          if (drawing) {
            requestAnimationFrame(draw);
          }
        };
        draw();
        const stream = canvas.captureStream(30);
        const ac = new AudioContext();
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        gain.gain.value = 0.05;
        const dest = ac.createMediaStreamDestination();
        osc.connect(gain).connect(dest);
        osc.start();
        stream.addTrack(dest.stream.getAudioTracks()[0]);
        const rec = new MediaRecorder(stream);
        const chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
          drawing = false;
          osc.stop();
          ac.close();
          document.getElementById("vid").src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType }));
          BT.log("test video ready");
        };
        rec.start();
        BT.log("recording 3 s");
        setTimeout(() => rec.stop(), 3000);
      };
    },
    steps: [
      "Tap `Make test video`. Wait for `test video ready` in the log.",
      "Tap `Play`. Tap `Video fullscreen`, or the fullscreen button of the video.",
      "Exit fullscreen with Back.",
      "Do the steps for each variant.",
    ],
    expected: [
      "In fullscreen, no toolbar shows and the video fills the screen.",
      "The orientation agrees with the note of the variant.",
      "After you exit, the screen can rotate freely again. The toolbar is fully shown.",
    ],
    sources: [
      P.mediaFs,
      `${P.fullScreen} :: Fixed tab switching to fullscreen mode and back`,
      `${P.bbft} :: WHEN asked to expand the browser view THEN hide all toolbars ...`,
    ],
  },

    init() {
      const makePdf = pages => {
        const kids = [];
        const objs = [];
        let n = 4;
        for (let i = 0; i < pages; i++) {
          const pageId = n++;
          const contentId = n++;
          kids.push(`${pageId} 0 R`);
          const text = `BT /F1 36 Tf 72 700 Td (Page ${i + 1} of ${pages}) Tj ET`;
          objs.push([pageId, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R >> >> /Contents ${contentId} 0 R >>`]);
          objs.push([contentId, `<< /Length ${text.length} >>\nstream\n${text}\nendstream`]);
        }
        const all = [
          [1, "<< /Type /Catalog /Pages 2 0 R >>"],
          [2, `<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${pages} >>`],
          [3, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"],
          ...objs,
        ];
        let out = "%PDF-1.4\n";
        const offsets = [];
        for (const [id, body] of all) {
          offsets[id] = out.length;
          out += `${id} 0 obj\n${body}\nendobj\n`;
        }
        const xref = out.length;
        out += `xref\n0 ${all.length + 1}\n0000000000 65535 f \n`;
        for (let id = 1; id <= all.length; id++) {
          out += `${String(offsets[id]).padStart(10, "0")} 00000 n \n`;
        }
        return out + `trailer\n<< /Size ${all.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
      };
      window.openPdf = () => {
        location.href = URL.createObjectURL(new Blob([makePdf(5)], { type: "application/pdf" }));
      };

const INDEX_INTRO = "Manual test cases for the bottom toolbar in Fenix, and for the GeckoView features that it uses. " +
  "The cases come from the GeckoView, Gecko, Android Components and Fenix tests. Each case shows the automated tests that cover it.";

const INDEX_HOWTO = `<details class="howto">
<summary>How to use this page</summary>
<h4>Open the page on the device</h4>
<ol>
<li>On the computer, go to the directory of this file. Run <code>python3 -m http.server 8000</code>.</li>
<li>Connect the device with USB. Run <code>adb reverse tcp:8000 tcp:8000</code>.</li>
<li>On the device, open <code>http://localhost:8000/bottom-toolbar.html</code> in Fenix.</li>
</ol>
<h4>Default Fenix settings</h4>
<ul>
<li>Settings &gt; Customize &gt; Address bar location: <b>Bottom</b>.</li>
<li>Settings &gt; Customize &gt; Toolbar layout: <b>Simple</b>, unless the case tells you to use Expanded.</li>
<li>Settings &gt; Customize &gt; Scroll to hide toolbar: <b>on</b>.</li>
<li>Settings &gt; Customize &gt; Pull to refresh: <b>on</b>.</li>
<li>TalkBack and switch access: <b>off</b>. Portrait orientation.</li>
</ul>
<h4>Words in the steps</h4>
<ul>
<li><b>Toolbar</b>: all the Fenix bars at the bottom edge (address bar, navigation bar, tab strip and microsurvey prompt).</li>
<li><b>Scroll down</b>: move your finger up, so that the page shows lower content. The toolbar hides.</li>
<li><b>Scroll up</b>: move your finger down. The toolbar shows.</li>
<li>When you lift your finger, Fenix moves the toolbar to fully shown or fully hidden. To see a <b>partly hidden</b> toolbar, keep your finger on the screen.</li>
</ul>
<h4>The test panel</h4>
<ul>
<li>Each case opens with a panel at the top. <b>Info</b> shows the steps. <b>HUD</b> shows live values. <b>&#8211;</b> makes the panel small.</li>
<li>The HUD shows CSS px. <code>inner</code> is <code>innerWidth</code> x <code>innerHeight</code>. <code>vv</code> is <code>visualViewport</code>. <code>lvh-svh</code> is the toolbar height that the engine knows.</li>
<li>For each element with a <code>data-measure</code> label, the HUD shows its top and bottom. <code>innerH-bottom</code> is the distance from the element bottom to the bottom of the layout viewport.</li>
<li>Values can differ by less than 1 px, because <code>innerHeight</code> and <code>clientHeight</code> are whole numbers.</li>
<li>The HUD draws 0.2 s after the page stops moving. It does not draw during a gesture, because a draw during a gesture can delay the toolbar.</li>
<li>Mark each case Pass, Fail or Skip, and add a note. The results stay on this device. <b>Export results</b> makes a Markdown table that you can put in a bug.</li>
<li>The page adds touch listeners only in the cases that need them. A touch listener changes how the engine reports touches, and the toolbar uses that report.</li>
</ul>
<h4>GeckoView</h4>
<p>The cases with the GeckoView label use web content only. Run them in Fenix, or in a GeckoView app that calls <code>GeckoView.setDynamicToolbarMaxHeight</code>. "Automated coverage" shows the tests for each case.</p>
<h4>Two scroll behaviors</h4>
<p>Android Components has two behaviors for a bottom toolbar: gestures (the default) and scroll data (opt-in, <code>EngineViewScrollingDataBehavior</code>). The cases in "When the toolbar hides and shows" can give different results. If you know the behavior of your build, write it in the note.</p>
<h4>Not covered by this page</h4>
<p>A web page cannot cause these conditions, so only automated tests cover them: a toolbar max height larger than the screen (<code>DynamicToolbarTest.outOfRangeValue</code>), an invalid (NaN) toolbar offset, offsets larger than the toolbar height, and the selection of the scroll behavior (<code>EngineViewScrollingBehaviorFactory</code>).</p>
</details>`;

    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  }
  const css = ((CURRENT && CURRENT.css) || "") + ((VARIANT && VARIANT.css) || "");
  if (css) {
    const style = document.createElement("style");
    style.textContent = css;
    document.head.appendChild(style);
  }
})();
</script>
</head>
<body>
<noscript>This page needs JavaScript.</noscript>
<script>
"use strict";

const STORE_KEY = "bottom-toolbar-results-v1";
const UI_KEY = "bottom-toolbar-ui-v1";
const T0 = performance.now();
const counters = { resize: 0, vvResize: 0, vvScroll: 0, scroll: 0 };
const eventLog = [];
const customMetrics = [];
// The HUD draws only when scroll and viewport events stop. A draw during a
// gesture delays the toolbar enough to change the result of the test.
const HUD_IDLE_MS = 200;
let lastActivity = 0;
let hudTimer = 0;

function esc(s) {
  return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
}
function fmt(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
}
function num(x) {
  if (Math.abs(x) < 0.05) {
    return "0";
  }
  return Number.isInteger(x) ? String(x) : x.toFixed(1);
}
function loadJson(key) {
  try {
    return JSON.parse(localStorage.getItem(key)) || {};
  } catch (e) {
    return {};
  }
}
function saveJson(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {}
}
const results = loadJson(STORE_KEY);
const ui = Object.assign({ details: true, hud: true, min: false }, loadJson(UI_KEY));

function setResult(id, patch) {
  results[id] = Object.assign({}, results[id], patch, { ts: new Date().toISOString() });
  if (!results[id].status && !results[id].note) {
    delete results[id];
  }
  saveJson(STORE_KEY, results);
}

function srcHtml(src) {
  if (/^bug \d+/i.test(src)) {
    const id = src.match(/\d+/)[0];
    return `<a href="https://bugzilla.mozilla.org/show_bug.cgi?id=${id}">${esc(src)}</a>`;
  }
  let [path, tests] = src.split(" :: ");
  for (const [alias, full] of Object.entries(SRC_ALIASES)) {
    if (path.startsWith(alias)) {
      path = full + path.slice(alias.length);
    }
  }
  const file = path.split("/").pop();
  return `<a href="https://searchfox.org/firefox-main/source/${esc(path)}" title="${esc(path)}">${esc(file)}</a>` +
    (tests ? `: <code>${esc(tests)}</code>` : "");
}

function listHtml(tag, items) {
  if (!items || !items.length) {
    return "";
  }
  return `<${tag}>${items.map(i => `<li>${fmt(i)}</li>`).join("")}</${tag}>`;
}

function hasTests(c) {
  return (c.sources || []).some(s => !/^bug \d+/i.test(s));
}

function caseBody(c) {
  let coverage = "<h4>Automated coverage</h4>";
  if (!hasTests(c)) {
    coverage = c.sources && c.sources.length ? "<h4>Related bugs (no automated test found)</h4>" : "";
  }
  return (c.setup && c.setup.length ? `<h4>Setup</h4>${listHtml("ul", c.setup)}` : "") +
    (c.variants ? `<h4>Variants</h4><ul>${c.variants.map(v => `<li><strong>${fmt(v.label)}</strong>${v.note ? ": " + fmt(v.note) : ""}</li>`).join("")}</ul>` : "") +
    `<h4>Steps</h4>${listHtml("ol", c.steps)}` +
    `<h4>Expected result</h4>${listHtml("ul", c.expected)}` +
    (c.sources && c.sources.length
      ? `${coverage}<ul class="src">${c.sources.map(s => `<li>${srcHtml(s)}</li>`).join("")}</ul>`
      : `<h4>Automated coverage</h4><p class="src">None found. Manual only.</p>`);
}

function platformBadges(c) {
  return (c.platforms || []).map(p => `<span class="badge ${p.toLowerCase()}">${p === "GV" ? "GeckoView" : p}</span>`).join(" ") +
    (hasTests(c) ? "" : ` <span class="badge manual">manual only</span>`);
}

function statusHtml(id) {
  const r = results[id];
  return r && r.status ? `<span class="status ${r.status}">${r.status.toUpperCase()}</span>` : "";
}

/* Live metrics */
function tagOf(t) {
  if (!t || !t.tagName) {
    return "";
  }
  return t.tagName.toLowerCase() + (t.type ? `[${t.type}]` : "") + (t.id ? `#${t.id}` : "");
}
function inPanel(t) {
  return t && t.closest && t.closest("#bt-panel, #bt-chip, #bt-export");
}
function logEvent(name, extra) {
  const vv = window.visualViewport;
  const t = ((performance.now() - T0) / 1000).toFixed(2);
  eventLog.push(`${t}s ${name}${extra ? " " + extra : ""}  in=${innerWidth}x${innerHeight}` +
    (vv ? ` vv=${num(vv.width)}x${num(vv.height)}@${num(vv.offsetTop)}` : ""));
  if (eventLog.length > 60) {
    eventLog.shift();
  }
  scheduleHud();
}
function hudVisible() {
  return ui.hud && !ui.min && !!document.getElementById("bt-hud");
}
function scheduleHud() {
  lastActivity = performance.now();
  if (!hudVisible()) {
    return;
  }
  clearTimeout(hudTimer);
  hudTimer = setTimeout(renderHud, HUD_IDLE_MS);
}
function refreshHudIfIdle() {
  if (hudVisible() && performance.now() - lastActivity >= HUD_IDLE_MS) {
    renderHud();
  }
}
function probeHeight(id) {
  const e = document.getElementById(id);
  return e ? num(e.getBoundingClientRect().height) : "?";
}
function safeArea() {
  const e = document.getElementById("bt-probe-sa");
  if (!e) {
    return "?";
  }
  const cs = getComputedStyle(e);
  return `t${parseFloat(cs.paddingTop)} r${parseFloat(cs.paddingRight)} b${parseFloat(cs.paddingBottom)} l${parseFloat(cs.paddingLeft)}`;
}
function renderHud() {
  const hud = document.getElementById("bt-hud");
  if (!hud) {
    return;
  }
  const vv = window.visualViewport;
  const de = document.documentElement;
  const se = document.scrollingElement || de;
  const maxY = typeof window.scrollMaxY === "number" ? window.scrollMaxY : se.scrollHeight - innerHeight;
  const svh = parseFloat(probeHeight("bt-probe-svh"));
  const lvh = parseFloat(probeHeight("bt-probe-lvh"));
  const lines = [
    `inner ${innerWidth}x${innerHeight}  client ${de.clientWidth}x${de.clientHeight}  dpr ${num(devicePixelRatio)}`,
    vv ? `vv ${num(vv.width)}x${num(vv.height)}  offLeft ${num(vv.offsetLeft)}  offTop ${num(vv.offsetTop)}  pageTop ${num(vv.pageTop)}  scale ${vv.scale.toFixed(2)}` : "vv: not supported",
    `vh ${probeHeight("bt-probe-vh")}  svh ${svh}  lvh ${lvh}  dvh ${probeHeight("bt-probe-dvh")}  fixed100% ${probeHeight("bt-probe-pct")}`,
    `lvh-svh ${num(lvh - svh)} (toolbar max)  screen ${screen.width}x${screen.height}`,
    `scrollY ${num(scrollY)} / ${num(maxY)}  safe-area ${safeArea()}`,
    `count: resize ${counters.resize}  vv.resize ${counters.vvResize}  vv.scroll ${counters.vvScroll}  scroll ${counters.scroll}`,
  ];
  if (document.fullscreenElement) {
    lines.push(`fullscreen: ${tagOf(document.fullscreenElement)}`);
  }
  for (const m of document.querySelectorAll("[data-measure]")) {
    const r = m.getBoundingClientRect();
    lines.push(`${m.dataset.measure}: top ${num(r.top)} bottom ${num(r.bottom)} innerH-bottom ${num(innerHeight - r.bottom)}`);
  }
  for (const [label, fn] of customMetrics) {
    let v;
    try {
      v = fn();
    } catch (e) {
      v = "error: " + e.message;
    }
    lines.push(`${label}: ${v}`);
  }
  lines.push("-- events --", ...eventLog.slice(-8).reverse());
  hud.textContent = lines.join("\n");
}

window.addEventListener("resize", () => {
  counters.resize++;
  logEvent("resize");
});
if (window.visualViewport) {
  visualViewport.addEventListener("resize", () => {
    counters.vvResize++;
    logEvent("vv.resize");
    fitPanelToScale();
  });
  visualViewport.addEventListener("scroll", () => {
    counters.vvScroll++;
    scheduleHud();
  });
}
window.addEventListener("scroll", () => {
  counters.scroll++;
  scheduleHud();
}, { passive: true });
document.addEventListener("fullscreenchange", () => logEvent("fullscreenchange", document.fullscreenElement ? "on" : "off"));
if (screen.orientation) {
  screen.orientation.addEventListener("change", () => logEvent("orientation", screen.orientation.type));
}
document.addEventListener("focusin", e => {
  if (!inPanel(e.target)) {
    logEvent("focusin", tagOf(e.target));
  }
});
document.addEventListener("focusout", e => {
  if (!inPanel(e.target)) {
    logEvent("focusout", tagOf(e.target));
  }
});
document.addEventListener("visibilitychange", () => logEvent("visibility", document.visibilityState));
window.addEventListener("pageshow", e => logEvent("pageshow", e.persisted ? "from bfcache" : ""));
window.addEventListener("load", () => fitPanelToScale());
window.addEventListener("error", e => logEvent("JS ERROR", e.message));

/* API for the fixtures. */
const BT = {
  log(msg) {
    logEvent(msg);
  },
  tap(ev, label) {
    const b = ev.currentTarget;
    b.dataset.n = String((parseInt(b.dataset.n || "0", 10)) + 1);
    b.textContent = `${label} (${b.dataset.n})`;
    logEvent(`tap ${label}`, `clientY=${num(ev.clientY)}`);
  },
  metric(label, fn) {
    customMetrics.push([label, fn]);
    scheduleHud();
  },
  scrollToY(y, smooth) {
    window.scrollTo({ top: y, behavior: smooth ? "smooth" : "instant" });
  },
  scrollToBottom(smooth) {
    const se = document.scrollingElement || document.documentElement;
    window.scrollTo({ top: se.scrollHeight, behavior: smooth ? "smooth" : "instant" });
  },
  toggle(id) {
    const e = document.getElementById(id);
    e.hidden = !e.hidden;
    logEvent(`toggle #${id}`, e.hidden ? "hidden" : "shown");
  },
  setViewport(content) {
    let meta = document.getElementById("bt-viewport");
    if (!meta) {
      meta = document.createElement("meta");
      meta.name = "viewport";
      meta.id = "bt-viewport";
      document.head.appendChild(meta);
    }
    meta.content = content;
    logEvent("meta viewport", `"${content}"`);
  },
  resetCounters() {
    for (const k of Object.keys(counters)) {
      counters[k] = 0;
    }
    eventLog.length = 0;
    logEvent("counters reset");
  },
  fullscreen(sel) {
    const e = sel ? document.querySelector(sel) : document.documentElement;
    e.requestFullscreen().catch(err => logEvent("requestFullscreen failed", err.message));
  },
};

/* Rendering */
function buildProbes() {
  const p = document.createElement("div");
  p.id = "bt-probes";
  p.setAttribute("aria-hidden", "true");
  p.innerHTML =
    '<div id="bt-probe-vh" style="height:100vh"></div>' +
    '<div id="bt-probe-svh" style="height:100svh"></div>' +
    '<div id="bt-probe-lvh" style="height:100lvh"></div>' +
    '<div id="bt-probe-dvh" style="height:100dvh"></div>' +
    '<div id="bt-probe-pct" style="height:100%"></div>' +
    '<div id="bt-probe-sa" style="height:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)"></div>';
  document.body.appendChild(p);
}

function saveUi() {
  saveJson(UI_KEY, ui);
}

function buildPanel(c) {
  const idx = c ? CASES.indexOf(c) : -1;
  const prev = idx > 0 ? CASES[idx - 1] : null;
  const next = idx >= 0 && idx < CASES.length - 1 ? CASES[idx + 1] : null;
  const panel = document.createElement("div");
  panel.id = "bt-panel";
  panel.setAttribute("role", "region");
  panel.setAttribute("aria-label", "Test panel");
  panel.innerHTML =
    '<div class="bar">' +
    (c ? '<a class="btn" href="?">Index</a>' +
      (prev ? `<a class="btn" href="?case=${prev.id}" aria-label="Previous case">&#9664;</a>` : "") +
      (next ? `<a class="btn" href="?case=${next.id}" aria-label="Next case">&#9654;</a>` : "") : "") +
    `<span class="cid">${c ? esc(c.id) + " " + statusHtml(c.id) : "Live metrics"}</span>` +
    (c ? `<button data-act="details" aria-pressed="${ui.details}">Info</button>` : "") +
    `<button data-act="hud" aria-pressed="${ui.hud}">HUD</button>` +
    '<button data-act="min" aria-label="Minimize panel">&#8211;</button>' +
    "</div>" +
    (c ? `<div id="bt-details"${ui.details ? "" : " hidden"}>` +
      `<h2>${fmt(c.title)}</h2><div>${platformBadges(c)}</div>` +
      (c.variants ? '<div class="variants">Variant: ' + c.variants.map((v, i) =>
        `<a class="btn" href="?case=${c.id}&amp;v=${i}"${i === VARIANT_INDEX ? ' aria-current="true"' : ""}>${fmt(v.label)}</a>`).join("") + "</div>" : "") +
      caseBody(c) +
      '<div class="result">' +
      '<button class="pass" data-status="pass">Pass</button>' +
      '<button class="fail" data-status="fail">Fail</button>' +
      '<button class="skip" data-status="skip">Skip</button>' +
      '<button data-status="">Clear</button>' +
      `<input type="text" id="bt-note" placeholder="Note (device, build, what you saw)" value="${esc((results[c.id] || {}).note || "")}">` +
      "</div></div>" : "") +
    `<div id="bt-hudwrap"${ui.hud ? "" : " hidden"}><pre id="bt-hud"></pre>` +
    '<div class="hudbar"><button data-act="reset">Reset counters</button></div></div>';
  const chip = document.createElement("button");
  chip.id = "bt-chip";
  chip.textContent = c ? `☰ ${c.id}` : "☰ Metrics";
  chip.hidden = !ui.min;
  panel.hidden = ui.min;

  const refreshStatus = () => {
    const r = results[c.id] || {};
    for (const b of panel.querySelectorAll("[data-status]")) {
      b.setAttribute("aria-pressed", String(!!b.dataset.status && b.dataset.status === r.status));
    }
    panel.querySelector(".cid").innerHTML = esc(c.id) + " " + statusHtml(c.id);
  };
  panel.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) {
      return;
    }
    if (b.dataset.act === "details") {
      ui.details = !ui.details;
      panel.querySelector("#bt-details").hidden = !ui.details;
      b.setAttribute("aria-pressed", String(ui.details));
    } else if (b.dataset.act === "hud") {
      ui.hud = !ui.hud;
      panel.querySelector("#bt-hudwrap").hidden = !ui.hud;
      b.setAttribute("aria-pressed", String(ui.hud));
      scheduleHud();
    } else if (b.dataset.act === "reset") {
      BT.resetCounters();
    } else if (b.dataset.act === "min") {
      ui.min = true;
      panel.hidden = true;
      chip.hidden = false;
    } else if ("status" in b.dataset) {
      setResult(c.id, { status: b.dataset.status || undefined });
      refreshStatus();
    }
    saveUi();
  });
  if (c) {
    panel.querySelector("#bt-note").addEventListener("change", e => {
      setResult(c.id, { note: e.target.value || undefined });
    });
  }
  chip.addEventListener("click", () => {
    ui.min = false;
    panel.hidden = false;
    chip.hidden = true;
    saveUi();
    scheduleHud();
  });
  document.body.append(panel, chip);
  if (c) {
    refreshStatus();
  }
  fitPanelToScale();
}

let lastScale = 0;
function fitPanelToScale() {
  const vv = window.visualViewport;
  if (!vv || vv.scale === lastScale) {
    return;
  }
  lastScale = vv.scale;
  const z = Math.min(3, Math.max(1, Math.round((1 / vv.scale) * 10) / 10));
  for (const id of ["bt-panel", "bt-chip"]) {
    const e = document.getElementById(id);
    if (e) {
      e.style.zoom = z;
    }
  }
}

function renderCase(c) {
  document.title = `${c.id}: ${c.title}`;
  const fx = document.createElement("div");
  fx.id = "fixture";
  const html = VARIANT && VARIANT.html !== undefined ? VARIANT.html : c.html;
  fx.innerHTML = typeof html === "function" ? html() : (html || rows());
  document.body.appendChild(fx);
  buildProbes();
  buildPanel(c);
  if (c.init) {
    c.init(fx, VARIANT);
  }
  setInterval(refreshHudIfIdle, 1000);
  scheduleHud();
}

function exportMarkdown() {
  const lines = [
    "# Bottom toolbar test results",
    "",
    `- Date: ${new Date().toISOString()}`,
    `- User agent: ${navigator.userAgent}`,
    `- Screen: ${screen.width}x${screen.height}, devicePixelRatio ${devicePixelRatio}`,
    `- Page: ${location.href.split("?")[0]}`,
    "",
    "| ID | Test | Status | Note |",
    "| --- | --- | --- | --- |",
  ];
  for (const c of CASES) {
    const r = results[c.id];
    if (r) {
      lines.push(`| ${c.id} | ${c.title.replace(/\|/g, "/")} | ${(r.status || "-").toUpperCase()} | ${(r.note || "").replace(/\|/g, "/")} |`);
    }
  }
  const text = lines.join("\n");
  const show = () => {
    const box = document.createElement("div");
    box.id = "bt-export";
    box.innerHTML = '<strong>Results (Markdown)</strong><textarea readonly></textarea><button>Close</button>';
    box.querySelector("textarea").value = text;
    box.querySelector("button").onclick = () => box.remove();
    document.body.appendChild(box);
    box.querySelector("textarea").select();
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => alert("The results are on the clipboard."), show);
  } else {
    show();
  }
}

function renderIndex() {
  const unknown = PARAMS.get("case");
  const counts = { pass: 0, fail: 0, skip: 0 };
  for (const c of CASES) {
    const r = results[c.id];
    if (r && counts[r.status] !== undefined) {
      counts[r.status]++;
    }
  }
  const run = counts.pass + counts.fail + counts.skip;
  let html = '<div class="index">' +
    "<h1>Bottom toolbar test cases</h1>" +
    `<p class="lead">${INDEX_INTRO}</p>` +
    (unknown ? `<p class="note">The case <code>${esc(unknown)}</code> does not exist.</p>` : "") +
    INDEX_HOWTO +
    '<div class="filters">' +
    '<input type="search" id="f-text" placeholder="Search" aria-label="Search cases">' +
    '<select id="f-platform" aria-label="Platform"><option value="">All platforms</option><option value="GV">GeckoView</option><option value="Fenix">Fenix</option></select>' +
    '<select id="f-cov" aria-label="Automated coverage"><option value="">All coverage</option><option value="auto">Automated</option><option value="manual">Manual only</option></select>' +
    '<select id="f-status" aria-label="Status"><option value="">All results</option><option value="none">Not run</option><option value="pass">Pass</option><option value="fail">Fail</option><option value="skip">Skip</option></select>' +
    '<button id="f-export">Export results</button>' +
    '<button id="f-reset">Clear results</button>' +
    "</div>" +
    `<p class="progress">${CASES.length} cases. ${run} run: ${counts.pass} pass, ${counts.fail} fail, ${counts.skip} skip.</p>`;
  for (const s of SECTIONS) {
    const cs = CASES.filter(c => c.section === s.id);
    if (!cs.length) {
      continue;
    }
    html += `<section data-section="${s.id}"><h2>${fmt(s.title)}</h2><p class="lead">${fmt(s.intro)}</p>`;
    for (const c of cs) {
      const r = results[c.id] || {};
      html += `<article class="card" data-id="${c.id}" data-platforms="${(c.platforms || []).join(" ")}" ` +
        `data-cov="${hasTests(c) ? "auto" : "manual"}" data-status="${r.status || "none"}" ` +
        `data-text="${esc((c.id + " " + c.title + " " + (c.steps || []).join(" ") + " " + (c.expected || []).join(" ")).toLowerCase())}">` +
        `<div class="card-head"><span class="cid">${c.id}</span><a class="title" href="?case=${c.id}">${fmt(c.title)}</a>` +
        `${platformBadges(c)} ${statusHtml(c.id)}</div>` +
        `<details><summary>Steps, expected result, coverage</summary>${caseBody(c)}` +
        (r.note ? `<h4>Note</h4><p>${esc(r.note)}</p>` : "") +
        "</details></article>";
    }
    html += "</section>";
  }
  html += "</div>";
  document.body.insertAdjacentHTML("beforeend", html);

  const apply = () => {
    const text = document.getElementById("f-text").value.trim().toLowerCase();
    const platform = document.getElementById("f-platform").value;
    const cov = document.getElementById("f-cov").value;
    const status = document.getElementById("f-status").value;
    for (const card of document.querySelectorAll(".card")) {
      card.hidden = !!((text && !card.dataset.text.includes(text)) ||
        (platform && !card.dataset.platforms.split(" ").includes(platform)) ||
        (cov && card.dataset.cov !== cov) ||
        (status && card.dataset.status !== status));
    }
    for (const sec of document.querySelectorAll("section[data-section]")) {
      sec.hidden = !sec.querySelector(".card:not([hidden])");
    }
  };
  for (const id of ["f-text", "f-platform", "f-cov", "f-status"]) {
    document.getElementById(id).addEventListener("input", apply);
  }
  document.getElementById("f-export").addEventListener("click", exportMarkdown);
  document.getElementById("f-reset").addEventListener("click", () => {
    if (confirm("Clear all results on this device?")) {
      localStorage.removeItem(STORE_KEY);
      location.reload();
    }
  });
  buildProbes();
  ui.min = ui.min || !PARAMS.has("hud");
  buildPanel(null);
  setInterval(refreshHudIfIdle, 1000);
}

if (CURRENT) {
  renderCase(CURRENT);
} else {
  renderIndex();
}
</script>
</body>
</html>
