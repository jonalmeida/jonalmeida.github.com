<style>
{# Some styling for comments are here to include some minial changes for the pre-fetched section. #}
section#comments {
  p {
    font-size: 0.8em;
  }
}

{# code block line highlighting is not visible with dark theme #}
pre mark {
  color: var(--code-color);
}

{# Override syntect's inline background so the .highlight wrapper's --code-background-color (with border-radius) shows through #}
pre {
  background-color: transparent !important;
}
</style>

{% if page?.extra?.mermaid %}
<style>
{# Pele draws the mermaid source. Its colors come from these variables, so the
   chart follows the theme's light and dark colors without a new render. #}
.pele {
  --pele-bg: transparent;
  --pele-fg: var(--text-color);
  --pele-muted: var(--text-color);
  --pele-line: var(--text-color);
  --pele-border: var(--text-color);
  --pele-surface-alt: #e6e6e6;
}
@media (prefers-color-scheme: dark) {
  .pele {
    --pele-surface-alt: #1d4452;
  }
}

{# The heart rate zone colors, zone 5 to zone 1 from top to bottom. The chart
   is the <pre> after the heading that atom.xml also looks for. #}
#heart-rate-zones + pre.mermaid .pele-bars rect:nth-child(1) { fill: #555555; }
#heart-rate-zones + pre.mermaid .pele-bars rect:nth-child(2) { fill: #FF8200; }
#heart-rate-zones + pre.mermaid .pele-bars rect:nth-child(3) { fill: #56CC3C; }
#heart-rate-zones + pre.mermaid .pele-bars rect:nth-child(4) { fill: #4090D4; }
#heart-rate-zones + pre.mermaid .pele-bars rect:nth-child(5) { fill: #AAAAAA; }

{# The pace per interval bars. One color, with a different step for each theme
   so that it has contrast on the background. #}
#intervals + pre.mermaid .pele-bars rect { fill: #3273dc; }
@media (prefers-color-scheme: dark) {
  #intervals + pre.mermaid .pele-bars rect { fill: #3d8fd6; }
}

{# Pele puts the SVG in the <pre>. Remove the code block look from it. #}
pre.mermaid {
  font: inherit;
  padding: 0;
  white-space: normal;
}
</style>
<script src="{{ get_url(path='js/pele-1.9.0.min.js') }}"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('pre.mermaid').forEach((el, i) => {
      pele.mount(el, el.textContent, { idPrefix: `mermaid-${i}-` });
    });
  });
</script>
{% endif %}
